services:
  - type: web
    name: social-threat-intel-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /_health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_AUTH_USERNAME
        sync: false
      - key: APP_AUTH_PASSWORD
        sync: false
      - key: BOB_API_KEY
        sync: false
      - key: BOB_MAX_COST
        value: "0.25"