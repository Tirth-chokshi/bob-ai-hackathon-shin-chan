submission:
  title: "Social Media Threat Intelligence Engine"  # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    Coordinated hashtag and messaging campaigns (such as during the 2020 Delhi riots and 2022 communal flare-ups)
    spread incitement, targeted harassment, and violent misinformation faster than police cyber cells can manually review.
    Law enforcement currently lacks automated forensic tools to detect coordinated inauthentic behavior (CIB) and translate
    digital signals into actionable, BNS/IPC-mapped evidentiary briefs before offline violence erupts.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    An OSINT threat intelligence engine that detects coordinated inauthentic behaviour (CIB) in a batch of social media
    posts by finding accounts that post, share links or reply together within seconds, then uses IBM Bob to classify each
    campaign (incitement, targeted harassment, organized misinformation, or benign), suggest BNS 2023 / IT Act sections
    for legal review, and draft a time-stamped police threat brief with escalation steps.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "Early warning of offline threats: IBM Bob extracts the planned gathering (place quoted from the posts, time checked) and the engine records when each network was first flagged, so the lead time before the gathering is shown"
    - "X API v2 native: ingests X API v2 JSON exactly as returned (search, timelines, filtered stream, or fetched from the app with X recent search), stores it in a per-dataset database that mirrors the X API objects, and shows posts, reposts, quotes and threads as on X with the real engagement counts"
    - "IBM Bob threat classifier: labels each campaign (incitement, harassment, misinformation, benign) and cites evidence post IDs that are verified in code"
    - "Legal suggestions: BNS 2023 (196, 197, 351, 353, 356, 79) and IT Act 2000 (66D, 67, 69A) mappings, marked for legal verification"
    - "Police threat brief: time-stamped, print-ready brief with SHA-256 hashes of the batch and every evidence post"

  tech_stack:
    languages: ["Python", "JavaScript"]
    frameworks: ["FastAPI", "Uvicorn", "Pydantic", "NetworkX", "coordination-network-toolkit", "React", "Vite"]
    ibm_technologies: ["IBM Bob", "IBM Bob MCP integration"]
    databases: ["SQLite"]
    other: ["Tailwind CSS", "Cytoscape.js", "lucide-react", "GitHub Actions"]

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    Behaviour-first detection: the engine flags coordinated campaigns even when each individual post looks harmless, and
    bridges that signal to Indian law (BNS 2023 / IT Act) so a cyber cell officer goes from a raw post batch to a
    time-stamped escalation brief with IBM Bob.

  known_limitations: >                 # Optional but recommended — be honest about gaps
    No ground-truth evaluation on real data: the public archives we tested have no campaign labels, and text-only labelled
    datasets (e.g. CONSTRAINT-2021) have no account or time, so they can't be analysed for coordination. X search needs
    a paid X API plan; there is no live platform connector beyond it and the demonstration stream API. Scores and
    classifications are decision support, and legal sections need verification by a legal officer. CIB score weights
    are hand-set and not calibrated on labelled data. Input is X API v2 JSON only. Bob's labels are not benchmarked.

