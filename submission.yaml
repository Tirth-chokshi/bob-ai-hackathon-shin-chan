submission:
  title: "Social Media Threat Intelligence Engine"  # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    Coordinated hashtag and messaging campaigns (such as during the 2020 Delhi riots and 2022 communal flare-ups)
    spread incitement, targeted harassment, and violent misinformation faster than police cyber cells can manually review.
    Law enforcement currently lacks automated forensic tools to detect coordinated inauthentic behavior (CIB) and translate
    digital signals into actionable, BNS/IPC-mapped evidentiary briefs before offline violence erupts.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    We built an AI-powered OSINT threat intelligence platform driven by IBM Bob and watsonx.ai Granite 3.0 that
    ingests multi-platform social feeds, detects coordinated inauthentic behavior (CIB) across bot swarms, classifies
    threat types (incitement, targeted harassment, organized misinformation), maps evidence to BNS 2023 and IT Act
    provisions, and auto-generates time-stamped police threat briefs with tactical escalation runbooks.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "Multi-Signal CIB Detection: Detects posting burst velocity, temporal synchronicity, and semantic near-duplicate messaging"
    - "Threat Classification via watsonx.ai Granite 3.0: Categorizes incitement, harassment, and communal misinformation with confidence scoring"
    - "Statutory Legal Mapping: Maps digital signals to Bharatiya Nyaya Sanhita (BNS) 2023 (Sec 196, 197, 353, 79) and IT Act 2000 (Sec 66A, 67, 69A)"
    - "IBM Bob Agent & MCP Integration: Model Context Protocol endpoints allowing IBM Bob to run investigative queries and execute triage runbooks"
    - "Automated Police Threat Brief Generator: Generates time-stamped, court-admissible threat briefs and Section 69A blocking recommendations"

  tech_stack:
    languages: ["Python", "JavaScript"]
    frameworks: ["FastAPI", "Uvicorn", "Pydantic", "Jinja2"]
    ibm_technologies: ["IBM Bob", "watsonx.ai Granite 3.0", "Bob MCP Protocol"]
    databases: ["SQLite", "In-Memory Vector Cache"]
    other: ["HTML5", "Modern CSS", "Chart.js", "GitHub Actions"]

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    The automated bridge between algorithmic Coordinated Inauthentic Behavior (CIB) signal detection and Indian penal
    jurisprudence (BNS 2023 / IPC / IT Act), enabling cyber cell officers and Station House Officers (SHOs) to move from raw
    social media chatter to a court-admissible, time-stamped escalation brief in seconds via IBM Bob.

  known_limitations: >                 # Optional but recommended — be honest about gaps
    Current ingestion operates on high-fidelity synthetic multi-account batch feeds simulating X/Twitter, Telegram, and WhatsApp;
    live Firehose streaming requires active platform API keys. Primary NLP models are optimized for English and Hinglish vernacular.

